name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build webpack app
        run: npm run build
        env:
          # These values are public after the static bundle is published.
          FORMSPREE_FORM_ID: ${{ vars.FORMSPREE_FORM_ID }}
          FORMSPREE_QUOTE_FORM_ID: ${{ vars.FORMSPREE_QUOTE_FORM_ID }}
          FORMSPREE_VISIT_FORM_ID: ${{ vars.FORMSPREE_VISIT_FORM_ID }}

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
